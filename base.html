<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Campus Event Management</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; }
    nav { background: #1f3a5f; padding: 12px 20px; }
    nav a { color: white; text-decoration: none; margin-right: 18px; font-size: 14px; }
    nav a:hover { text-decoration: underline; }
    .container { max-width: 1000px; margin: 25px auto; background: white; padding: 25px; border-radius: 6px; }
    h2 { margin-top: 0; color: #1f3a5f; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px; border-bottom: 1px solid #ddd; font-size: 14px; }
    th { background: #e8eef6; }
    label { display: block; margin-top: 14px; font-weight: bold; font-size: 14px; }
    input, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 22px; background: #1f3a5f; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .msg { padding: 10px; margin-bottom: 15px; border-radius: 4px; }
    .ok { background: #d9f2e0; color: #1d6b34; }
    .error { background: #fbdcdc; color: #9b1c1c; }
    .pos { color: #1d6b34; font-weight: bold; }
    .neg { color: #9b1c1c; font-weight: bold; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Events</a>
    <a href="/add_event">Add Event</a>
    <a href="/allocate_venue">Allocate Venue</a>
    <a href="/assign_volunteer">Assign Volunteer</a>
    <a href="/volunteers">Volunteers</a>
    <a href="/add_expense">Add Expense</a>
    <a href="/add_sponsorship">Add Sponsorship</a>
    <a href="/summary">Financial Summary</a>
  </nav>
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="msg {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
